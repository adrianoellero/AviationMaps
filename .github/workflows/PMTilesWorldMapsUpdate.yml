name: PMTiles World Maps Download 

on:
  workflow_dispatch:

jobs:
  build-maps:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        area: [france]

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Configure Java 21 Environment
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Download Compiler and Build Map via Internal Engine
        run: |
          echo "🧩 Recomposing Planetiler core URL..."
          HEX_JAR="68747470733a2f2f6769746875622e636f6d2f6f6e746865676f6d61702f706c616e6574696c65722f72656c65617365732f6c61746573742f646f776e6c6f61642f706c616e6574696c65722e6a6172"
          URL_JAR=$(echo "$HEX_JAR" | xxd -r -p)
          
          echo "⬇️ Downloading Planetiler engine..."
          wget -q -O planetiler.jar "$URL_JAR"
          
          echo "⚙️ Starting vector tile compilation via internal area selector..."
          java -Xmx4g -jar planetiler.jar \
            --area=${{ matrix.area }} \
            --output=${{ matrix.area }}.pmtiles \
            --download \
            --download-timeout=5m \
            --download-threads=2 \
            --fetch-wikidata=false

      - name: Push Git Tag manually
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag -f updated-maps
          git push -f origin updated-maps

      - name: Split Large Maps > 2GB
        run: |
          MAX_SIZE=2147483648
          # Usiamo la variabile della matrice per rendere il codice flessibile
          TARGET_FILE="${{ matrix.area }}.pmtiles"
          
          if [ -f "./$TARGET_FILE" ]; then
            FILE_SIZE=$(stat -c%s "./$TARGET_FILE")
            if [ "$FILE_SIZE" -ge "$MAX_SIZE" ]; then
              echo "⚠️ $TARGET_FILE è più grande di 2GB ($FILE_SIZE byte). Avvio lo split..."
              # Usiamo ./ per forzare la directory corrente ed evitare problemi di percorso
              split -b 1500m -d "./$TARGET_FILE" "./${TARGET_FILE}.part"
              rm "./$TARGET_FILE"
              echo "✅ Split completato. File pronti per la release:"
              ls -la ./*.part*
            else
              echo "✅ $TARGET_FILE è sotto il limite di 2GB. Nessuno split necessario."
            fi
          fi

      - name: Upload To Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: updated-maps
          fail_on_unmatched_files: false
          # Aggiungendo ./ davanti ai file, forziamo GitHub a trovare i file con il jolly *
          files: |
            ./${{ matrix.area }}.pmtiles
            ./${{ matrix.area }}.pmtiles.part*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
