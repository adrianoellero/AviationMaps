name: Generazione Automatica Mappe PMTiles

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

jobs:
  build-maps:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dichiarazione esplicita dei permessi di scrittura nel workflow

    steps:
      # 1. Scarica il codice del repository
      - name: Checkout del codice
        uses: actions/checkout@v4

      # 2. Installa Java (Aggiornato alla v5 per allineamento a Node 24)
      - name: Configura Java Runtime
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      # 3. Scarica il compilatore Planetiler con indirizzo completo
      - name: Scarica Planetiler
        run: |
          wget https://github.com

      # 4. Scarica i dati geografici grezzi del Centro Italia da Geofabrik
      - name: Scarica dati geografici grezzi
        run: |
          wget -O centro-italia.osm.pbf https://geofabrik.de

      # 5. Compila il file .pmtiles ad alta risoluzione
      - name: Genera file PMTiles vettoriale
        run: |
          java -Xmx6g -jar planetiler.jar --osm_path=centro-italia.osm.pbf --output=italia_centro.pmtiles

      # 6. Crea la Release ed inserisce il file della mappa
      - name: Crea Release e Carica Mappe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mappe-aggiornate
          name: Aggiornamento Mappe Offline
          draft: false
          prerelease: false
          files: |
            italia_centro.pmtiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

