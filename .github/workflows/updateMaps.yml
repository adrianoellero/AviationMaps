# FORCED_REFRESH_V2
name: Generazione Automatica Mappe PMTiles

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

jobs:
  build-maps:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Java Runtime
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Scarica dati e Genera file PMTiles
        run: |
          echo "⬇️ Scarico il compilatore Planetiler..."
          wget -q https://github.com
          
          echo "⬇️ Scarico la mappa grezza da Geofabrik..."
          wget -q -O centro-italia.osm.pbf https://geofabrik.de
          
          echo "⚙️ Avvio la compilazione con download automatico dei layer idrografici di supporto..."
          java -Xmx4g -jar planetiler.jar --osm_path=centro-italia.osm.pbf --output=italia_centro.pmtiles --nodemap-type=sparse --storage=mmap --download

      - name: Crea Release e Carica Mappe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mappe-aggiornate
          name: Aggiornamento Mappe Offline
          draft: false
          prerelease: false
          files: italia_centro.pmtiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

