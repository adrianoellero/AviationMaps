name: Generazione Automatica Mappe PMTiles

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

jobs:
  build-maps:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Scarica il codice del repository
      - name: Checkout del codice
        uses: actions/checkout@v4

      # 2. Installa Java 21
      - name: Configura Java Runtime
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      # 3. Unico step: Scarica i file ed esegui la compilazione nello stesso ambiente
      - name: Scarica dati e Genera file PMTiles
        run: |
          echo "⬇️ Scarico il compilatore Planetiler..."
          wget -q https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar
          
          echo "⬇️ Scarico la mappa grezza da Geofabrik..."
          wget -q -O centro-italia.osm.pbf https://geofabrik.de
          
          echo "⚙️ Avvio la compilazione vettoriale ad alta risoluzione..."
          java -Xmx4g -jar planetiler.jar --osm_path=centro-italia.osm.pbf --output=italia_centro.pmtiles --nodemap-type=sparse --storage=mmap

      # 4. Crea la Release ed inserisce il file della mappa
      - name: Crea Release e Carica Mappe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mappe-aggiornate
          name: Aggiornamento Mappe Offline
          draft: false
          prerelease: false
          files: italia_centro.pmtiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



