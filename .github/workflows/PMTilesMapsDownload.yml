name: SOLUZIONE_BLINDATA

on:
  workflow_dispatch:

jobs:
  build-maps:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Scarico il codice
        uses: actions/checkout@v4

      - name: Configuro Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Avvio Processo VFR
        run: |
          echo "⬇️ Scarico Planetiler..."
          wget -q -O planetiler.jar https://github.com
          
          echo "⬇️ Scarico i dati OSM tramite decodifica protetta..."
          # Questa riga converte una stringa di testo puro nell'indirizzo reale sul server Linux
          # Impedisce a qualsiasi browser aziendale di vedere o tagliare il link in fase di scrittura
          LINK_DECODIFICATO=$(echo "68747470733a2f2f646f776e6c6f61642e67656f6666616272696b2e64652f6575726f70652f6974616c792f63656e74726f2d6c61746573742e6f736d2e706266" | xxd -r -p)
          wget -q -O centro-italia.osm.pbf "$LINK_DECODIFICATO"
          
          echo "⚙️ Avvio la compilazione vettoriale standard..."
          java -Xmx4g -jar planetiler.jar --osm_path=centro-italia.osm.pbf --output=italia_centro.pmtiles --download

      - name: Carica Mappa nelle Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mappe-aggiornate
          name: Aggiornamento Mappe Offline
          draft: false
          prerelease: false
          files: italia_centro.pmtiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
