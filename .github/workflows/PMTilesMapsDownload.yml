name: MOTORE_DI_VOLO_PROTOMAPS

on:
  workflow_dispatch:

jobs:
  build-maps:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Scarico il codice
        uses: actions/checkout@v4

      - name: Configuro Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Avvio Processo VFR Protomaps
        run: |
          echo "⬇️ Genero i link tramite decodifica locale..."
          
          # Indirizzo Planetiler nascosto (evita le modifiche del browser locale)
          HEX_JAR="68747470733a2f2f6769746875622e636f6d2f6f6e746865676f6d61702f706c616e6574696c65722f72656c65617365732f6c61746573742f646f776e6c6f61642f706c616e6574696c65722e6a6172"
          URL_JAR=$(echo "$HEX_JAR" | xxd -r -p)
          
          # NUOVA SORGENTE: Indirizzo Protomaps per l'estratto dell'Italia Centrale nascosto
          HEX_MAP="68747470733a2f2f6275696c64732e70726f746f6d6170732e636f6d2f6f736d2f63656e74726f2d6974616c69612e6f736d2e706266"
          URL_MAP=$(echo "$HEX_MAP" | xxd -r -p)
          
          echo "⬇️ Scarico il compilatore Planetiler..."
          wget -q -O planetiler.jar "$URL_JAR"
          
          echo "⬇️ Scarico la mappa grezza da Protomaps Builds..."
          wget -q -O centro-italia.osm.pbf "$URL_MAP"
          
          echo "⚙️ Avvio la compilazione vettoriale standard..."
          java -Xmx4g -jar planetiler.jar --osm_path=centro-italia.osm.pbf --output=italia_centro.pmtiles --download

      - name: Carica Mappa nelle Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mappe-aggiornate
          name: Aggiornamento Mappe Offline
          draft: false
          prerelease: false
          files: italia_centro.pmtiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
