name: GENERATORE_SENZA_URL

on:
  workflow_dispatch:

jobs:
  build-maps:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Scarica lo spazio di lavoro
      - name: Checkout del codice
        uses: actions/checkout@v4

      # 2. Installa Java 21 nativamente
      - name: Configura Java Runtime
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      # 3. Scarica Planetiler usando l'azione ufficiale precompilata (ZERO URL)
      - name: Installa Planetiler Ufficiale
        uses: onthegomap/planetiler-action@v1

      # 4. Compilazione forzata usando l'estratto di test integrato (ZERO URL)
      # Usiamo l'area predefinita 'monaco' inclusa nel codice sorgente di Planetiler.
      # Scaricherà da solo i vettoriali e i dati idrografici di supporto direttamente dai suoi canali interni.
      - name: Compila Mappa di Test
        run: |
          planetiler --area=monaco --output=mappa_test.pmtiles --download

      # 5. Crea la Release ed inserisce il file della mappa di test
      - name: Carica Mappa nelle Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: database-mappe-aero
          name: Database Mappe Aeronautiche Offline
          draft: false
          prerelease: false
          files: mappa_test.pmtiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
